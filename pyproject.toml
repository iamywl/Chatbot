[project]
name = "private-mlx-chatbot"
version = "0.1.0"
description = "Private Local MLX LLM Chatbot with Memory Lifecycle Control, AES-256-GCM Encrypted Git Vault, and Multi-Session Reasoning UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0.0",
    "psutil>=5.9.0",
    "mlx-lm>=0.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
